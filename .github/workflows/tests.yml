name: Inspector checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build browser-local PWA from original engine
        run: |
          python -m pip install .
          curl --fail --location --output /tmp/pyodide-core.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.29.5/pyodide-core-0.29.5.tar.bz2
          python tools/build_website.py --runtime-archive /tmp/pyodide-core.tar.bz2
          python tools/build_hosting.py
          node --test tests/web/hosting.test.mjs
          npm install --no-save --package-lock=false playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Verify native parity, privacy, install metadata and offline reload
        run: node tests/browser/website.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: website-checks
          path: test-results/website/

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - name: Ten portfolio scenarios with privacy-safe evidence
        run: python tools/run_portfolio_validation.py --suite portfolio --output reports/ci-portfolio.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-portfolio-${{ matrix.os }}-${{ matrix.python }}
          path: reports/ci-portfolio.*
      - name: Installed CLI and packaged web assets
        shell: bash
        run: |
          download-inspector inspect README.md --output test-report.json
          python -c "from importlib.resources import files; assert files('download_inspector').joinpath('web/index.html').is_file()"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-checks
          path: test-results/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install bandit==1.9.4
      - name: Reject high-confidence high-severity findings
        run: bandit -r src -lll -iii
      - name: Preserve every static warning for review
        run: bandit -r src -f json -o bandit.json || test $? -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-security-review
          path: bandit.json
